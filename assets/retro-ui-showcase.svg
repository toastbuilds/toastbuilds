      <stop offset="1" stop-color="#313244"/>
    </linearGradient>
    <linearGradient id="dialArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#fab387"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#585b70" stroke-width="1" opacity=".18"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="390" rx="34"/></clipPath>
