<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Retro UI — racing instruments with personality</title>
  <desc id="desc">Catppuccin Mocha card featuring retro-inspired instrumentation, timing and rounded interface details.</desc>
  <defs>
